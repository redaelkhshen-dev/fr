<head>

<title>منصة مسيو رضا الخشن</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&family=Tajawal:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#0b0a07;--bg2:#100e09;--card:#17140c;--line:#3a3119;--fg:#faf5e8;--muted:#bcb193;--accent:#d4a73a;--accent-deep:#b8862b;--accent-2:#f0cf6e;--accent-text:#f0d078;--soft:rgba(212,167,58,.16);--good:#3ddc84;--bad:#ff6b7a;--warn:#ffb84d;--fd:"Cairo","Segoe UI",Tahoma,sans-serif;--fb:"Tajawal","Segoe UI",Tahoma,sans-serif;--fm:"IBM Plex Mono",ui-monospace,Consolas,monospace;color-scheme:dark}
html[data-theme=light]{--bg:#fbf7ec;--bg2:#f3ecd8;--card:#fffdf6;--line:#e2d4a8;--fg:#2a2310;--muted:#6f6445;--accent:#b8862b;--accent-deep:#a06f14;--accent-2:#d4a73a;--accent-text:#8a5f0a;--soft:rgba(184,134,43,.14);--good:#168a4a;--bad:#c62f43;--warn:#b86e00;color-scheme:light}
html[data-theme=light] .hdr{background:rgba(251,247,236,.94)}
html[data-theme=light] .hero .bgphoto{opacity:.18}
.tbtn{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--accent-text);cursor:pointer;transition:border-color .15s,transform .2s}
.tbtn:hover{border-color:var(--accent);transform:rotate(20deg)}
.tbtn svg{width:20px;height:20px}
.tbtn .sun{display:none}html[data-theme=light] .tbtn .sun{display:block}html[data-theme=light] .tbtn .moon{display:none}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 var(--fb);min-height:100vh}
a{color:inherit;text-decoration:none}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--fd);line-height:1.35}
img{max-width:100%}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px;border-radius:6px}
.wrap{max-width:1120px;margin-inline:auto;padding-inline:16px}
.hdr{position:sticky;top:0;z-index:20;background:rgba(11,10,7,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.hdr-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--fd);font-weight:700}
.logo small{display:block;font:400 .72rem var(--fb);color:var(--muted);line-height:1.2}
.logo-mark{display:block;flex:none;width:44px;height:44px;border-radius:50%;overflow:hidden;border:2px solid var(--accent);box-shadow:0 0 0 3px rgba(212,167,58,.18)}
.logo-mark img{width:100%;height:100%;object-fit:cover;display:block}
.hdr-r{display:flex;align-items:center;gap:10px}
.chipuser{display:flex;align-items:center;gap:10px;padding:4px 14px 4px 6px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-weight:600;max-width:240px;transition:border-color .15s}
.chipuser:hover{border-color:var(--accent)}
.chipuser span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.92rem}
.av{display:inline-grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,var(--accent-deep),var(--accent-2));color:#1b1405;font-family:var(--fd);font-weight:700;overflow:hidden;flex:none;line-height:1}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 22px;border-radius:8px;border:1px solid transparent;font:600 .95rem var(--fd);cursor:pointer;transition:transform .15s,border-color .15s,background .15s;color:var(--fg);background:transparent}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-fill{background:linear-gradient(135deg,var(--accent-deep),var(--accent-2));color:#1b1405}
.btn-fill:not(:disabled):hover{transform:translateY(-1px)}
.btn-line{border-color:#6b5a2a;background:transparent}
.btn-line:hover{border-color:var(--accent-text);background:var(--soft)}
.btn-sm{min-height:36px;padding:0 14px;font-size:.85rem}
.btn-bad{border-color:rgba(255,107,122,.5);color:var(--bad)}
.btn-bad:hover{background:rgba(255,107,122,.12)}
.btn-good{border-color:rgba(61,220,132,.5);color:var(--good)}
.w100{width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(60% 60% at 80% 10%,rgba(212,167,58,.18),transparent 70%),var(--bg)}
.auth-card{width:min(100%,480px);display:flex;flex-direction:column;gap:14px}
.auth-card.wide{width:min(100%,640px)}
.auth-card h1{font-size:1.6rem}
.sub{color:var(--muted);margin-top:-6px}
.alt{text-align:center;color:var(--muted);font-size:.93rem}
.alt a,.lnk{color:var(--accent-text);font-weight:600;cursor:pointer;background:none;border:0;padding:0;font:inherit}
.adm-link{position:fixed;bottom:10px;inset-inline-start:14px;font-size:.72rem;color:#7a6a3a}
.adm-link:hover{color:var(--muted)}
form{display:flex;flex-direction:column;gap:14px}
.fl{display:flex;flex-direction:column;gap:6px;font-size:.9rem;font-weight:500;color:var(--muted)}
.fl em{font-style:normal;color:var(--bad)}
input:not([type=radio]):not([type=checkbox]):not([type=file]),select,textarea{width:100%;min-height:46px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:1rem var(--fb)}
textarea{padding:10px 14px;min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
input[dir=ltr]{text-align:left}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);cursor:pointer;font-size:.92rem;transition:.15s}
.chip input:checked+span{background:var(--accent);border-color:var(--accent);color:#1b1405;font-weight:700}
.chip input:focus-visible+span{outline:2px solid var(--accent-text);outline-offset:2px}
.grp{font-size:.9rem;font-weight:500;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.picker{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.emojis{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;max-width:340px}
.em{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:1.2rem;cursor:pointer}
.em:hover{border-color:var(--accent)}
.alert{padding:10px 14px;border-radius:8px;background:rgba(255,107,122,.12);border:1px solid rgba(255,107,122,.4);color:#ffb3bb;font-size:.92rem}
.okbox{background:rgba(61,220,132,.1);border-color:rgba(61,220,132,.4);color:#9af0c0}
.terms{display:flex;gap:10px;align-items:flex-start;font-size:.92rem;color:var(--muted)}
.terms input{margin-top:6px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.sec{padding-block:32px}
.hero-s{padding-block:28px 8px}
.hero-s h1{font-size:clamp(1.4rem,3.6vw,2rem)}
.hero-s p{color:var(--muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-block:20px 18px;align-items:center}
.tab{min-height:42px;padding:0 20px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted);font:600 .95rem var(--fd);cursor:pointer}
.tab.on{background:var(--accent);border-color:var(--accent);color:#1b1405}
.srch{flex:1;min-width:180px;max-width:320px;margin-inline-start:auto}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.vcard{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:border-color .15s,transform .15s}
.vcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.thumb{position:relative;aspect-ratio:16/9;background:#000}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.play{position:absolute;inset:0;display:grid;place-items:center;font-size:2rem;color:#fff;background:rgba(11,10,7,.35)}
.vb{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.vb h3{font-size:1.02rem}
.vb p{color:var(--muted);font-size:.88rem}
.fcard{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.ficon{flex:none;display:grid;place-items:center;width:52px;height:52px;border-radius:12px;background:var(--soft);color:var(--accent-text);font:800 .85rem var(--fd)}
.fcard .t{flex:1;min-width:0}
.fcard h3{font-size:1rem;overflow:hidden;text-overflow:ellipsis}
.fcard small{color:var(--muted)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:48px 16px;border:1px dashed var(--line);border-radius:14px}
.badge{display:inline-block;padding:1px 10px;border-radius:6px;font-size:.78rem;background:var(--soft);color:var(--accent-text);white-space:nowrap}
.hw{align-items:flex-start;flex-wrap:wrap}.hw .t{flex:1;min-width:200px}.hw .m{display:flex;gap:6px;flex-wrap:wrap}.hwa{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hwrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 4px;border-bottom:1px solid var(--line)}.hwrow .who{flex:1;min-width:160px}.hwmid{flex:1.2;min-width:160px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.exam{max-width:820px;margin:0 auto}.xq{margin-bottom:14px}.xh{display:flex;gap:8px;align-items:flex-start;margin-bottom:10px;font-weight:600}.xh span{flex:1}.xq textarea{min-height:110px}
.xo{display:flex;gap:10px;align-items:center;padding:10px 14px;margin-top:8px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--bg2)}.xo:hover{border-color:var(--accent)}.xo input{accent-color:var(--accent);width:18px;height:18px;flex:none}
.xo.r{cursor:default}.xo.right{border-color:var(--good);background:rgba(61,220,132,.1)}.xo.wrong{border-color:var(--bad);background:rgba(255,107,122,.1)}.xq.ok{border-inline-start:4px solid var(--good)}.xq.no{border-inline-start:4px solid var(--bad)}
.xans{white-space:pre-wrap;padding:10px 14px;border-radius:10px;background:var(--bg2);margin:6px 0}
.xres{text-align:center;margin-bottom:16px}.xbig{font:800 3.2rem/1.2 var(--fd);margin:6px 0}.xbig small{font-size:1.2rem;color:var(--muted)}.xbig.good{color:var(--good)}.xbig.warn{color:var(--warn)}.xbig.bad{color:var(--bad)}
.qb{margin-bottom:12px;padding:14px}.qbh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.qbh .qn{color:var(--accent-text)}.qbh select{flex:1;min-width:140px}.qpl{display:flex;gap:6px;align-items:center;font-size:.85rem}.qb .qpl input.qp{width:76px;flex:none}.qbh select{width:auto}
.qo{display:flex;gap:8px;align-items:center;margin-top:8px}.qo .qc{width:18px;height:18px;flex:none;accent-color:var(--accent)}.qo .qopt{flex:1}
.hwfb{margin-top:8px;padding:8px 12px;border-radius:8px;background:var(--soft);font-size:.9rem}
.badge.good{background:rgba(61,220,132,.14);color:var(--good)}
.badge.bad{background:rgba(255,107,122,.14);color:var(--bad)}
.badge.warn{background:rgba(255,184,77,.14);color:var(--warn)}
.player{position:relative;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;border:1px solid var(--line);user-select:none;-webkit-user-select:none}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.shield{position:absolute;inset:0 0 auto 0;height:64px;z-index:2}
.wm{position:absolute;z-index:3;pointer-events:none;color:rgba(255,255,255,.32);font:600 .8rem var(--fm);text-shadow:0 0 4px #000;direction:ltr;animation:wm 24s linear infinite}
.wm.b{animation-delay:-12s}
@keyframes wm{0%{top:8%;left:6%}25%{top:72%;left:58%}50%{top:30%;left:66%}75%{top:76%;left:8%}100%{top:8%;left:6%}}
.fsbtn{position:absolute;top:10px;left:10px;z-index:4;min-height:34px;padding:0 12px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:rgba(11,10,7,.7);color:#fff;font:600 .8rem var(--fd);cursor:pointer}
.watch{display:grid;grid-template-columns:2fr 1fr;gap:24px;align-items:start}
@media(min-width:1100px){.wrap.wide,body:has(.wide) .hdr .wrap{max-width:1480px}.watch{grid-template-columns:minmax(0,1fr) 380px;gap:32px}.side{position:sticky;top:84px}}
@media(min-width:1700px){.wrap.wide,body:has(.wide) .hdr .wrap{max-width:1640px}.watch{grid-template-columns:minmax(0,1fr) 420px}}
.side{display:flex;flex-direction:column;gap:12px}
.side a{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px}
.side a:hover,.side a.cur{border-color:var(--accent)}
.side img{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;flex:none}
.side span{font-size:.88rem;line-height:1.4}
.pf{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.pf-top{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.pf-top h2{font-size:1.2rem}
.pf-top small{color:var(--muted);direction:ltr;display:block}
.nav-a{display:flex;gap:8px;flex-wrap:wrap}
.atab{min-height:40px;padding:0 16px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--muted);font:600 .92rem var(--fd);cursor:pointer}
.atab.on{background:var(--soft);color:var(--accent-text);border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.stat b{display:block;font:800 1.8rem var(--fd)}
.stat span{color:var(--muted);font-size:.86rem}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:110px 1fr 40px;gap:10px;align-items:center;font-size:.9rem}
.bar i{display:block;height:10px;border-radius:6px;background:linear-gradient(90deg,var(--accent-deep),var(--accent-2))}
.bar .bg{background:var(--bg);border-radius:6px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.toolbar input,.toolbar select{width:auto;min-width:150px;flex:1;max-width:260px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:860px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:.82rem;background:var(--bg2)}
tr:last-child td{border-bottom:0}
.who{display:flex;align-items:center;gap:10px;min-width:170px}
.ph{direction:ltr;font-family:var(--fm);font-size:.85rem;white-space:nowrap}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.acard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.acard h3{font-size:1rem}
.acard .m{display:flex;gap:6px;flex-wrap:wrap}
.overlay{position:fixed;inset:0;z-index:60;background:rgba(6,5,3,.78);display:grid;place-items:center;padding:16px;overflow-y:auto}
.modal{width:min(100%,520px);max-height:94vh;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px}
.modal.wide{width:min(100%,640px)}
.modal h2{font-size:1.2rem}
.mact{display:flex;gap:10px;justify-content:flex-start;flex-wrap:wrap}
.prog{height:8px;border-radius:6px;background:var(--bg);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
#toast{position:fixed;bottom:18px;inset-inline:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:90;pointer-events:none}
.toast{background:#2a210c;border:1px solid var(--accent);padding:10px 18px;border-radius:10px;font-size:.92rem;pointer-events:auto}
.toast.err{border-color:var(--bad)}
.toast.ok{border-color:var(--good)}
.loading{min-height:100vh;display:grid;place-items:center;color:var(--muted)}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.legal{max-height:50vh;overflow-y:auto;color:var(--muted);font-size:.93rem;display:flex;flex-direction:column;gap:8px}
.legal b{color:var(--fg)}
.foot{border-top:1px solid var(--line);padding-block:20px;color:var(--muted);font-size:.84rem;text-align:center;margin-top:40px}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.watch,.pf{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.grid{grid-template-columns:1fr}.row2{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.chipuser .n{display:none}.chipuser{padding:4px}.srch{max-width:none;margin:0;flex-basis:100%}.bar{grid-template-columns:80px 1fr 32px}}
@media(prefers-reduced-motion:reduce){.wm{animation:none;top:8%;left:6%}.wm.b{top:80%;left:60%}.spin{animation:none}}

/* ===== v2: portfolio-style design ===== */
section[id]{scroll-margin-top:84px}
.pnav{display:flex;align-items:center;gap:28px}
.pnav button,.pnav a{white-space:nowrap;background:none;border:0;color:var(--muted);font:500 .95rem var(--fb);cursor:pointer;padding:8px 0;transition:color .15s}
.pnav button:hover,.pnav a:hover{color:var(--fg)}
.eyebrow{display:inline-block;font:600 .8rem var(--fd);letter-spacing:.04em;color:var(--accent-text);background:var(--soft);border-radius:6px;padding:2px 12px}
.band{padding-block:72px}
.band.alt{background:var(--bg2);border-block:1px solid var(--line)}
.sec-head{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;margin-bottom:40px}
.sec-head h2{font-size:clamp(1.5rem,3.4vw,2.1rem);font-weight:700}
.sec-head h2::after{content:"";display:block;width:36px;height:3px;margin:12px auto 0;border-radius:3px;background:var(--accent)}
.sec-head p{color:var(--muted);max-width:52ch}
.hero{position:relative;overflow:hidden;padding-block:56px 80px;background:radial-gradient(60% 80% at 15% 40%,rgba(212,167,58,.18),transparent 70%),var(--bg)}
.hero>.wrap,.shero>.wrap{position:relative;z-index:1}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:40px}
.hero-text{display:flex;flex-direction:column;align-items:flex-start;gap:20px;min-width:0}
.hero h1{font-size:clamp(2.1rem,5.4vw,3.5rem);font-weight:800;line-height:1.25}
.hero h1 .hl,.shero h1 .hl{color:var(--accent-text)}
/* تأثير اسم المنصة */
.hero h1 .hl-fx{position:relative;display:inline-block;padding:0 .08em;background:none;color:transparent;-webkit-background-clip:initial;background-clip:initial;filter:drop-shadow(0 0 18px rgba(212,167,58,.45));animation:hlIn 1s cubic-bezier(.2,.8,.2,1) both,hlGlow 4s ease-in-out 1s infinite}
.hl-fx b{font:inherit;background:linear-gradient(100deg,#9a6b12 0%,#f6dc8c 20%,#fff6d2 32%,#d4a73a 46%,#f6dc8c 62%,#9a6b12 80%,#f6dc8c 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hlShine 4.5s linear infinite}

async function attachStudent(u) {
  S.net = false;
  const dref = doc(db, "students", u.uid), dev = deviceId();
  let snap;
  try { snap = await getDoc(dref); } catch { return netRetry(u); }
  if (!snap.exists()) return kick("هذا الحساب غير موجود أو تم حذفه. تواصل مع المدرس.");
  const d = snap.data();
  if (d.status === "banned") return kick("تم حظر هذا الحساب. تواصل مع المدرس.");
  if (d.status === "rejected") return kick("تم رفض طلب تسجيلك. تواصل مع المدرس.");
  const typ = deviceType();
  if (!d[typ]) { if (d.status === "active") { try { await updateDoc(dref, { [typ]: dev }); d[typ] = dev; } catch (er) { return er.code === "permission-denied" ? kick("تعذر تثبيت الحساب على هذا الجهاز") : netRetry(u); } } }
  else if (d[typ] !== dev) return kick(`هذا الحساب مسجّل على ${devName(typ)} آخر. تواصل مع المدرس لفك ارتباطه.`);
  S.student = { id: u.uid, ...d };
  clearSubs();
  S.unsubSelf = onSnapshot(dref, s => {
    if (!s.exists()) return kick("تم حذف هذا الحساب.");
    const x = s.data();
    if (x.status === "banned") return kick("تم حظر هذا الحساب. تواصل مع المدرس.");
    if (x.status === "rejected") return kick("تم رفض طلب تسجيلك. تواصل مع المدرس.");
    if (x[typ] && x[typ] !== dev) return kick(`تم تسجيل الدخول لهذا الحساب من ${devName(typ)} آخر.`);
    if (S.student?.[typ] && !x[typ]) return kick("تم فك ارتباط جهازك. سجّل الدخول مرة أخرى.");
    const prev = S.student?.status;
    S.student = { id: u.uid, ...x };
    if (prev !== x.status) { if (x.status === "active") { if (!x[typ]) updateDoc(dref, { [typ]: dev }).catch(() => {}); startContent(); toast("🎉 تم قبول حسابك، أهلًا بك في المنصة", "ok"); } render(); }
  }, () => {});
  if (S.student.status === "active") startContent();
  S.ready = true; render();
}

const lsKey = () => "rf_prog_" + (S.student?.id || "");
const readLocal = () => { try { return JSON.parse(localStorage.getItem(lsKey()) || "{}"); } catch { return {}; } };
const getProg = id => {
  const a = S.student?.progress?.[id] || {}, b = readLocal()[id] || {}, best = (b.at || 0) > (a.at || 0) ? b : a, p = Math.max(a.p || 0, b.p || 0);
  return { p, t: best.t || 0, d: best.d || 0, done: p >= 90 };
};
const T = { id: null, player: null, timer: 0, lastSave: 0 };
function saveProg(id, t, d, flush) {
  if (!S.student || !d || !isFinite(d)) return;
  const p = Math.max(getProg(id).p, Math.min(100, Math.round(t / d * 1000) / 10));
  const rec = { p, t: Math.floor(t), d: Math.floor(d), at: Date.now() };
  try { const m = readLocal(); m[id] = rec; localStorage.setItem(lsKey(), JSON.stringify(m)); } catch {}
  S.student.progress = { ...(S.student.progress || {}), [id]: rec };
  const now = Date.now();
  if (flush || now - T.lastSave > 15000) { T.lastSave = now; updateDoc(doc(db, "students", S.student.id), { ["progress." + id]: rec }).catch(() => {}); }
}
function stopTracker() {
  if (T.timer) clearInterval(T.timer); T.timer = 0;
  if (T.player && T.id) { try { saveProg(T.id, T.player.getCurrentTime(), T.player.getDuration(), true); } catch {} try { T.player.destroy(); } catch {} }
  T.player = null; T.id = null;
}
window.addEventListener("pagehide", () => { if (T.player && T.id) { try { saveProg(T.id, T.player.getCurrentTime(), T.player.getDuration(), true); } catch {} } });
let ytLoad;
const loadYT = () => ytLoad || (ytLoad = new Promise(res => {
  if (window.YT?.Player) return res(window.YT);
  const prev = window.onYouTubeIframeAPIReady, tag = document.createElement("script");
  window.onYouTubeIframeAPIReady = () => { try { prev?.(); } catch {} res(window.YT); };
  tag.src = "https://www.youtube.com/iframe_api"; tag.onerror = () => res(null); document.head.append(tag);
  setTimeout(() => res(null), 12000);
}));
async function startTracker(v) {
  const YT = await loadYT(), ifr = $("#ytp");
  if (!YT || !ifr || S.page !== "watch") return;
  const my = v.id; T.id = my;
  const paint = (t, d) => {
    const pr = getProg(my), p = Math.round(Math.max(pr.p, d ? Math.min(100, t / d * 100) : 0));
    const f = $("#pf"); if (!f) return;
    f.style.width = p + "%"; $("#pp").textContent = p + "%"; f.closest(".pbar")?.style.setProperty("--p", p); f.closest(".pbar")?.classList.toggle("fin100", p >= 90);
    $("#pt").textContent = p >= 90 ? "✅ أتممت مشاهدة هذا الفيديو" : d ? `شاهدت ${fmtTime(t)} من ${fmtTime(d)}` : "";
  };
  const tick = force => { try { const t = T.player.getCurrentTime(), d = T.player.getDuration(); if (!d) return; if (force || T.player.getPlayerState() === 1) saveProg(my, t, d, force); paint(t, d); } catch {} };
  T.player = new YT.Player(ifr, { events: {
    onReady: () => { tick(); T.timer = setInterval(tick, 1000); },
    onStateChange: e => { if (e.data === 2 || e.data === 0) tick(true); }
  } });
}
const fmtTime = n => { n = Math.max(0, Math.floor(n)); const h = Math.floor(n / 3600), m = Math.floor(n % 3600 / 60), s2 = n % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s2).padStart(2, "0"); };

  try {
    if (btn.dataset.a === "accept") {
      await updateDoc(dref, { status: "active" }); toast(`تم قبول ${x.name}`, "ok");
    } else if (btn.dataset.a === "reject") {
      if (!confirm(`رفض طلب تسجيل ${x.name}؟`)) return;
      await updateDoc(dref, { status: "rejected" }); toast("تم رفض الطلب", "ok");
    } else if (btn.dataset.a === "ban") {
      const ban = x.status !== "banned";
      if (!confirm(ban ? `حظر الطالب ${x.name}؟` : `فك الحظر عن ${x.name}؟`)) return;
      await updateDoc(dref, { status: ban ? "banned" : "active" }); toast(ban ? "تم الحظر" : "تم فك الحظر", "ok");
    } else if (btn.dataset.a === "dev") {
      if (!confirm(`فك ارتباط كل أجهزة ${x.name}؟ سيستطيع التسجيل من هاتف وكمبيوتر جديدين.`)) return;
      await updateDoc(dref, { devM: "", devD: "", deviceId: "" }); toast("تم فك ارتباط الأجهزة", "ok");
    } else if (btn.dataset.a === "del") {
      if (!confirm(`حذف الطالب ${x.name} نهائيًا؟ لا يمكن التراجع.`)) return;
      await deleteDoc(dref); toast("تم حذف الطالب", "ok");
    } else if (btn.dataset.a === "edit") editStudent(x);
  } catch (er) { toast("فشلت العملية: " + (er.code || er.message), "err"); }
}
function editStudent(x) {
  const m = openModal(`<h2>تعديل بيانات الطالب</h2><p class="sub" dir="ltr" style="text-align:start">${esc(x.phone)}</p><div class="alert" id="err" hidden></div>
    <form id="ef" novalidate>${profileFields(x)}<label class="fl">الحالة<select name="status"><option value="active" ${x.status === "active" ? "selected" : ""}>نشط</option><option value="pending" ${x.status === "pending" ? "selected" : ""}>قيد المراجعة</option><option value="rejected" ${x.status === "rejected" ? "selected" : ""}>مرفوض</option><option value="banned" ${x.status === "banned" ? "selected" : ""}>محظور</option></select></label>
    <div class="mact"><button class="btn btn-fill" id="sb">حفظ</button><button type="button" class="btn btn-line" data-close>إلغاء</button></div></form>`, true);
  const form = $("#ef", m); bindStageGrade(form);
  form.addEventListener("submit", async e => {
    e.preventDefault(); showErr("");
    try { const p = readProfile(form); p.status = new FormData(form).get("status"); $("#sb", m).disabled = true; await updateDoc(doc(db, "students", x.id), p); m.remove(); toast("تم الحفظ", "ok"); }
    catch (er) { showErr(er.message); $("#sb", m).disabled = false; }
  });
}

/* ---- إجراءات الفيديو والملفات ---- */
async function contentAction(e) {
  const btn = e.target.closest("[data-a]"); if (!btn || btn.tagName === "A") return;
  const a = btn.dataset.a, id = btn.dataset.id;
  try {
    if (a === "vadd") return videoModal();
    if (a === "vedit") return videoModal(S.videos.find(v => v.id === id));
    if (a === "vdel") { const v = S.videos.find(v => v.id === id); if (v && confirm(`حذف الفيديو "${v.title}"؟`)) { await deleteDoc(doc(db, "videos", id)); toast("تم الحذف", "ok"); } return; }
    if (a === "fadd") return fileModal();
    if (a === "fedit") return fileModal(S.files.find(f => f.id === id));
    if (a === "fdel") {
      const f = S.files.find(f => f.id === id); if (!f || !confirm(`حذف الملف "${f.title}"؟`)) return;
      if (f.storagePath) { try { await deleteObject(ref(storage, f.storagePath)); } catch {} }
      await deleteDoc(doc(db, "files", id)); toast("تم الحذف", "ok");
    }
  } catch (er) { toast("فشلت العملية: " + (er.code || er.message), "err"); }
}
const targetFields = c => `<div class="row3"><label class="fl">المرحلة<select name="stage"></select></label><label class="fl">النظام<select name="system"></select></label><label class="fl">الصف<select name="grade"></select></label></div>`;
const sysOptsFor = stage => stage === "all" || !SYS_BY_STAGE[stage] ? [["all", "لغات + حكومي"], ["lang", "لغات فقط"], ["gov", "حكومي فقط"]] : SYS_BY_STAGE[stage].length === 1 ? [[SYS_BY_STAGE[stage][0], SYSTEMS[SYS_BY_STAGE[stage][0]]]] : [["all", "لغات + حكومي"], ...SYS_BY_STAGE[stage].map(k => [k, SYSTEMS[k] + " فقط"])];
const gradeOptsFor = stage => [["all", stage === "all" ? "كل الصفوف" : "كل صفوف المرحلة"], ...(GRADES[stage] || []).map(g => [g, g])];
const optHTML = (list, cur) => list.map(([k, v]) => `<option value="${esc(k)}" ${k === cur ? "selected" : ""}>${esc(v)}</option>`).join("");
function bindTarget(form, c) {
  const st = $('select[name="stage"]', form), sy = $('select[name="system"]', form), gr = $('select[name="grade"]', form);
  st.innerHTML = optHTML([["all", "كل المراحل"], ...Object.entries(STAGES)], c?.stage || "all");
  const fill = (keepSys, keepGr) => { sy.innerHTML = optHTML(sysOptsFor(st.value), keepSys); gr.innerHTML = optHTML(gradeOptsFor(st.value), keepGr); };
  fill(c?.system || "all", c?.grade || "all");
  st.addEventListener("change", () => fill("all", "all"));
}
function videoModal(v) {
  const m = openModal(`<h2>${v ? "تعديل فيديو" : "إضافة فيديو"}</h2><div class="alert" id="err" hidden></div>
    <form id="vf" novalidate><label class="fl">عنوان الفيديو<input name="title" maxlength="120" value="${esc(v?.title)}"></label>
    <label class="fl">رابط YouTube<input name="url" dir="ltr" placeholder="https://youtu.be/XXXXXXXXXXX" value="${v ? `https://youtu.be/${esc(v.ytId)}` : ""}"></label>
    <p class="sub" style="margin-top:-6px;font-size:.84rem">اجعل الفيديو على يوتيوب <b>غير مدرج (Unlisted)</b> مع السماح بالتضمين.</p>
    ${targetFields(v)}<label class="fl">وصف (اختياري)<textarea name="description" maxlength="300">${esc(v?.description)}</textarea></label>
    <div class="mact"><button class="btn btn-fill" id="sb">حفظ</button><button type="button" class="btn btn-line" data-close>إلغاء</button></div></form>`);
  bindTarget($("#vf", m), v);
  $("#vf", m).addEventListener("submit", async e => {
    e.preventDefault(); showErr(""); const f = new FormData(e.target), title = (f.get("title") || "").trim(), id = ytId(f.get("url"));
    if (!title) return showErr("اكتب عنوان الفيديو");
    if (!id) return showErr("رابط يوتيوب غير صحيح");
    const data = { title, ytId: id, stage: f.get("stage"), system: f.get("system"), grade: f.get("grade") || "all", description: (f.get("description") || "").trim() };
    $("#sb", m).disabled = true;
    try { if (v) await updateDoc(doc(db, "videos", v.id), data); else await addDoc(collection(db, "videos"), { ...data, createdAt: serverTimestamp() }); m.remove(); toast("تم الحفظ", "ok"); }
    catch (er) { showErr("فشل الحفظ: " + (er.code || er.message)); $("#sb", m).disabled = false; }
  });
}
function fileModal(fl) {
  const m = openModal(`<h2>${fl ? "تعديل ملف" : "إضافة ملف"}</h2><div class="alert" id="err" hidden></div>
    <form id="ff" novalidate><label class="fl">عنوان الملف<input name="title" maxlength="120" value="${esc(fl?.title)}"></label>${targetFields(fl)}
    <label class="fl">${fl ? "استبدال الملف (اختياري)" : "ارفع ملف Word أو PDF"}<input type="file" name="file" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" style="padding:10px 0"></label>
    <label class="fl">أو ضع رابط مباشر (Google Drive مثلًا)<input name="url" dir="ltr" placeholder="https://drive.google.com/file/d/..." value="${fl && !fl.storagePath ? esc(fl.url) : ""}"></label>
    <div class="prog" id="pg" hidden><i></i></div>
    <div class="mact"><button class="btn btn-fill" id="sb">حفظ</button><button type="button" class="btn btn-line" data-close>إلغاء</button></div></form>`);
  bindTarget($("#ff", m), fl);
  $("#ff", m).addEventListener("submit", async e => {
    e.preventDefault(); showErr(""); const f = new FormData(e.target), title = (f.get("title") || "").trim(), file = f.get("file"), link = (f.get("url") || "").trim();
    if (!title) return showErr("اكتب عنوان الملف");
    const has = file && file.size > 0;
    if (!fl && !has && !link) return showErr("ارفع ملفًا أو ضع رابطًا");
    if (has && file.size > 50 * 1048576) return showErr("الحد الأقصى لحجم الملف 50 ميجا");
    const data = { title, stage: f.get("stage"), system: f.get("system"), grade: f.get("grade") || "all" };
    $("#sb", m).disabled = true;
    try {
      if (has) {
        const ext = (file.name.split(".").pop() || "file").toLowerCase().slice(0, 5);
        if (!["pdf", "doc", "docx"].includes(ext)) throw new Error("الصيغ المسموحة: PDF أو Word فقط");
        const path = `files/${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`, task = uploadBytesResumable(ref(storage, path), file), pg = $("#pg", m); pg.hidden = false;
        await new Promise((res, rej) => task.on("state_changed", s => { $("i", pg).style.width = (s.bytesTransferred / s.totalBytes * 100) + "%"; }, rej, res));
        const url = await getDownloadURL(task.snapshot.ref);
        if (fl?.storagePath) { try { await deleteObject(ref(storage, fl.storagePath)); } catch {} }
        Object.assign(data, { url, storagePath: path, ext, size: file.size });
      } else if (link) {
        if (!/^https?:\/\//i.test(link)) throw new Error("الرابط يجب أن يبدأ بـ https://");
        if (fl?.storagePath && link !== fl.url) { try { await deleteObject(ref(storage, fl.storagePath)); } catch {} }
        if (!fl || link !== fl.url) Object.assign(data, { url: driveLink(link), storagePath: "", ext: (link.split("?")[0].split(".").pop() || "").length <= 4 ? link.split("?")[0].split(".").pop().toLowerCase() : "link", size: 0 });
      }
      if (fl) await updateDoc(doc(db, "files", fl.id), data); else await addDoc(collection(db, "files"), { ...data, createdAt: serverTimestamp() });
      m.remove(); toast("تم الحفظ", "ok");
    } catch (er) {
      const stor = (er.code || "").startsWith("storage/");
      showErr(stor ? "تعذر الرفع على Firebase Storage. تأكد من تفعيله وقواعده، أو استخدم رابطًا مباشرًا بدلًا من الرفع." : (er.message || "فشل الحفظ"));
      $("#sb", m).disabled = false; $("#pg", m).hidden = true;
    }
  });
}

  document.addEventListener("pointermove", e => { if (e.pointerType !== "mouse" || rm.matches || raf) return; raf = requestAnimationFrame(() => { raf = 0; const r = document.documentElement.style; r.setProperty("--px", ((e.clientX / innerWidth - .5) * -18).toFixed(1) + "px"); r.setProperty("--py", ((e.clientY / innerHeight - .5) * -14).toFixed(1) + "px"); }); });
})();
