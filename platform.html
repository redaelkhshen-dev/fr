<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>منصة مسيو رضا الخشن</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&family=Tajawal:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#0a0a1f;--bg2:#0d0d27;--card:#12122e;--line:#26264d;--fg:#f1f1fb;--muted:#a6a6cc;--accent:#7c5cff;--accent-deep:#6444f0;--accent-2:#4f6bff;--accent-text:#b39dff;--soft:rgba(124,92,255,.16);--good:#3ddc84;--bad:#ff6b7a;--warn:#ffb84d;--fd:"Cairo","Segoe UI",Tahoma,sans-serif;--fb:"Tajawal","Segoe UI",Tahoma,sans-serif;--fm:"IBM Plex Mono",ui-monospace,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 var(--fb);min-height:100vh}
a{color:inherit;text-decoration:none}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--fd);line-height:1.35}
img{max-width:100%}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px;border-radius:6px}
.wrap{max-width:1120px;margin-inline:auto;padding-inline:16px}
.hdr{position:sticky;top:0;z-index:20;background:rgba(10,10,31,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.hdr-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--fd);font-weight:700}
.logo small{display:block;font:400 .72rem var(--fb);color:var(--muted);line-height:1.2}
.logo-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent-deep),var(--accent-2));font-weight:800;color:#fff}
.hdr-r{display:flex;align-items:center;gap:10px}
.chipuser{display:flex;align-items:center;gap:10px;padding:4px 14px 4px 6px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-weight:600;max-width:240px;transition:border-color .15s}
.chipuser:hover{border-color:var(--accent)}
.chipuser span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.92rem}
.av{display:inline-grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,var(--accent-deep),var(--accent-2));color:#fff;font-family:var(--fd);font-weight:700;overflow:hidden;flex:none;line-height:1}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 22px;border-radius:8px;border:1px solid transparent;font:600 .95rem var(--fd);cursor:pointer;transition:transform .15s,border-color .15s,background .15s;color:var(--fg);background:transparent}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-fill{background:linear-gradient(135deg,var(--accent-deep),var(--accent-2));color:#fff}
.btn-fill:not(:disabled):hover{transform:translateY(-1px)}
.btn-line{border-color:#44447a;background:transparent}
.btn-line:hover{border-color:var(--accent-text);background:var(--soft)}
.btn-sm{min-height:36px;padding:0 14px;font-size:.85rem}
.btn-bad{border-color:rgba(255,107,122,.5);color:var(--bad)}
.btn-bad:hover{background:rgba(255,107,122,.12)}
.btn-good{border-color:rgba(61,220,132,.5);color:var(--good)}
.w100{width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(60% 60% at 80% 10%,rgba(124,92,255,.18),transparent 70%),var(--bg)}
.auth-card{width:min(100%,480px);display:flex;flex-direction:column;gap:14px}
.auth-card.wide{width:min(100%,640px)}
.auth-card h1{font-size:1.6rem}
.sub{color:var(--muted);margin-top:-6px}
.alt{text-align:center;color:var(--muted);font-size:.93rem}
.alt a,.lnk{color:var(--accent-text);font-weight:600;cursor:pointer;background:none;border:0;padding:0;font:inherit}
.adm-link{position:fixed;bottom:10px;inset-inline-start:14px;font-size:.72rem;color:#4b4b80}
.adm-link:hover{color:var(--muted)}
form{display:flex;flex-direction:column;gap:14px}
.fl{display:flex;flex-direction:column;gap:6px;font-size:.9rem;font-weight:500;color:var(--muted)}
.fl em{font-style:normal;color:var(--bad)}
input:not([type=radio]):not([type=checkbox]):not([type=file]),select,textarea{width:100%;min-height:46px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:1rem var(--fb)}
textarea{padding:10px 14px;min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
input[dir=ltr]{text-align:left}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);cursor:pointer;font-size:.92rem;transition:.15s}
.chip input:checked+span{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.chip input:focus-visible+span{outline:2px solid var(--accent-text);outline-offset:2px}
.grp{font-size:.9rem;font-weight:500;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.picker{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.emojis{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;max-width:340px}
.em{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:1.2rem;cursor:pointer}
.em:hover{border-color:var(--accent)}
.alert{padding:10px 14px;border-radius:8px;background:rgba(255,107,122,.12);border:1px solid rgba(255,107,122,.4);color:#ffb3bb;font-size:.92rem}
.okbox{background:rgba(61,220,132,.1);border-color:rgba(61,220,132,.4);color:#9af0c0}
.terms{display:flex;gap:10px;align-items:flex-start;font-size:.92rem;color:var(--muted)}
.terms input{margin-top:6px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.sec{padding-block:32px}
.hero-s{padding-block:28px 8px}
.hero-s h1{font-size:clamp(1.4rem,3.6vw,2rem)}
.hero-s p{color:var(--muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-block:20px 18px;align-items:center}
.tab{min-height:42px;padding:0 20px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted);font:600 .95rem var(--fd);cursor:pointer}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.srch{flex:1;min-width:180px;max-width:320px;margin-inline-start:auto}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.vcard{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:border-color .15s,transform .15s}
.vcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.thumb{position:relative;aspect-ratio:16/9;background:#000}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.play{position:absolute;inset:0;display:grid;place-items:center;font-size:2rem;color:#fff;background:rgba(10,10,31,.35)}
.vb{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.vb h3{font-size:1.02rem}
.vb p{color:var(--muted);font-size:.88rem}
.fcard{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.ficon{flex:none;display:grid;place-items:center;width:52px;height:52px;border-radius:12px;background:var(--soft);color:var(--accent-text);font:800 .85rem var(--fd)}
.fcard .t{flex:1;min-width:0}
.fcard h3{font-size:1rem;overflow:hidden;text-overflow:ellipsis}
.fcard small{color:var(--muted)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:48px 16px;border:1px dashed var(--line);border-radius:14px}
.badge{display:inline-block;padding:1px 10px;border-radius:6px;font-size:.78rem;background:var(--soft);color:var(--accent-text);white-space:nowrap}
.badge.good{background:rgba(61,220,132,.14);color:var(--good)}
.badge.bad{background:rgba(255,107,122,.14);color:var(--bad)}
.badge.warn{background:rgba(255,184,77,.14);color:var(--warn)}
.player{position:relative;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;border:1px solid var(--line);user-select:none;-webkit-user-select:none}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.shield{position:absolute;inset:0 0 auto 0;height:64px;z-index:2}
.wm{position:absolute;z-index:3;pointer-events:none;color:rgba(255,255,255,.32);font:600 .8rem var(--fm);text-shadow:0 0 4px #000;direction:ltr;animation:wm 24s linear infinite}
.wm.b{animation-delay:-12s}
@keyframes wm{0%{top:8%;left:6%}25%{top:72%;left:58%}50%{top:30%;left:66%}75%{top:76%;left:8%}100%{top:8%;left:6%}}
.fsbtn{position:absolute;top:10px;left:10px;z-index:4;min-height:34px;padding:0 12px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:rgba(10,10,31,.7);color:#fff;font:600 .8rem var(--fd);cursor:pointer}
.watch{display:grid;grid-template-columns:2fr 1fr;gap:24px;align-items:start}
.side{display:flex;flex-direction:column;gap:12px}
.side a{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px}
.side a:hover,.side a.cur{border-color:var(--accent)}
.side img{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;flex:none}
.side span{font-size:.88rem;line-height:1.4}
.pf{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.pf-top{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.pf-top h2{font-size:1.2rem}
.pf-top small{color:var(--muted);direction:ltr;display:block}
.nav-a{display:flex;gap:8px;flex-wrap:wrap}
.atab{min-height:40px;padding:0 16px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--muted);font:600 .92rem var(--fd);cursor:pointer}
.atab.on{background:var(--soft);color:var(--accent-text);border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.stat b{display:block;font:800 1.8rem var(--fd)}
.stat span{color:var(--muted);font-size:.86rem}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:110px 1fr 40px;gap:10px;align-items:center;font-size:.9rem}
.bar i{display:block;height:10px;border-radius:6px;background:linear-gradient(90deg,var(--accent-deep),var(--accent-2))}
.bar .bg{background:var(--bg);border-radius:6px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.toolbar input,.toolbar select{width:auto;min-width:150px;flex:1;max-width:260px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:860px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:.82rem;background:var(--bg2)}
tr:last-child td{border-bottom:0}
.who{display:flex;align-items:center;gap:10px;min-width:170px}
.ph{direction:ltr;font-family:var(--fm);font-size:.85rem;white-space:nowrap}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.acard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.acard h3{font-size:1rem}
.acard .m{display:flex;gap:6px;flex-wrap:wrap}
.overlay{position:fixed;inset:0;z-index:60;background:rgba(5,5,18,.78);display:grid;place-items:center;padding:16px;overflow-y:auto}
.modal{width:min(100%,520px);max-height:94vh;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px}
.modal.wide{width:min(100%,640px)}
.modal h2{font-size:1.2rem}
.mact{display:flex;gap:10px;justify-content:flex-start;flex-wrap:wrap}
.prog{height:8px;border-radius:6px;background:var(--bg);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
#toast{position:fixed;bottom:18px;inset-inline:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:90;pointer-events:none}
.toast{background:#1c1c44;border:1px solid var(--accent);padding:10px 18px;border-radius:10px;font-size:.92rem;pointer-events:auto}
.toast.err{border-color:var(--bad)}
.toast.ok{border-color:var(--good)}
.loading{min-height:100vh;display:grid;place-items:center;color:var(--muted)}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.legal{max-height:50vh;overflow-y:auto;color:var(--muted);font-size:.93rem;display:flex;flex-direction:column;gap:8px}
.legal b{color:var(--fg)}
.foot{border-top:1px solid var(--line);padding-block:20px;color:var(--muted);font-size:.84rem;text-align:center;margin-top:40px}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.watch,.pf{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.grid{grid-template-columns:1fr}.row2{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.chipuser .n{display:none}.chipuser{padding:4px}.srch{max-width:none;margin:0;flex-basis:100%}.bar{grid-template-columns:80px 1fr 32px}}
@media(prefers-reduced-motion:reduce){.wm{animation:none;top:8%;left:6%}.wm.b{top:80%;left:60%}.spin{animation:none}}

/* ===== v2: portfolio-style design ===== */
section[id]{scroll-margin-top:84px}
.pnav{display:flex;align-items:center;gap:28px}
.pnav button,.pnav a{white-space:nowrap;background:none;border:0;color:var(--muted);font:500 .95rem var(--fb);cursor:pointer;padding:8px 0;transition:color .15s}
.pnav button:hover,.pnav a:hover{color:var(--fg)}
.eyebrow{display:inline-block;font:600 .8rem var(--fd);letter-spacing:.04em;color:var(--accent-text);background:var(--soft);border-radius:6px;padding:2px 12px}
.band{padding-block:72px}
.band.alt{background:var(--bg2);border-block:1px solid var(--line)}
.sec-head{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;margin-bottom:40px}
.sec-head h2{font-size:clamp(1.5rem,3.4vw,2.1rem);font-weight:700}
.sec-head h2::after{content:"";display:block;width:36px;height:3px;margin:12px auto 0;border-radius:3px;background:var(--accent)}
.sec-head p{color:var(--muted);max-width:52ch}
.hero{position:relative;overflow:hidden;padding-block:56px 80px;background:radial-gradient(60% 80% at 15% 40%,rgba(124,92,255,.18),transparent 70%),var(--bg)}
.hero>.wrap,.shero>.wrap{position:relative;z-index:1}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:40px}
.hero-text{display:flex;flex-direction:column;align-items:flex-start;gap:20px;min-width:0}
.hero h1{font-size:clamp(2.1rem,5.4vw,3.5rem);font-weight:800;line-height:1.25}
.hero h1 .hl,.shero h1 .hl{color:var(--accent-text)}
.hero h1 .sub{display:block;font-size:.62em;font-weight:700;margin-top:6px}
.lead{color:var(--muted);font-size:1.08rem;max-width:48ch}
.cta-row{display:flex;flex-wrap:wrap;gap:14px}
.tag-label{font-size:.78rem;letter-spacing:.04em;color:var(--muted);margin-top:12px}
.tags{display:flex;flex-wrap:wrap;gap:10px}
.tag{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 14px;font-size:.92rem;font-weight:500}
.tag b{font-family:var(--fd);color:var(--accent-text);font-weight:700;direction:ltr}
.hero-visual{position:relative;width:min(100%,400px);margin-inline:auto}
.disc{position:relative;aspect-ratio:1;border-radius:50%;padding:10px;background:linear-gradient(160deg,#8b6bff 0%,#4f3bd6 55%,#2a2290 100%);box-shadow:0 30px 80px rgba(100,68,240,.35);animation:pop .9s cubic-bezier(.2,.8,.2,1) both,float 6s ease-in-out .9s infinite,glow 4s ease-in-out infinite}
.disc::before{content:"";position:absolute;inset:-12px;border-radius:50%;z-index:-1;background:conic-gradient(from 0deg,transparent 0 25%,var(--accent-text) 50%,var(--accent-2) 75%,transparent 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));animation:ringspin 9s linear infinite}
.disc img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;border:4px solid var(--bg)}
.disc .av{width:100%!important;height:100%!important;font-size:5rem!important;border:4px solid var(--bg)}
.disc.sm{width:min(100%,230px);margin-inline:auto}
.dots{position:absolute;top:4%;inset-inline-start:-2%;width:90px;height:90px;background-image:radial-gradient(var(--accent-text) 1.4px,transparent 1.6px);background-size:16px 16px;opacity:.5;animation:dotsdrift 7s ease-in-out infinite alternate}
.carte{position:absolute;bottom:-18px;inset-inline-end:-26px;width:232px;direction:ltr;text-align:left;background:rgba(14,14,40,.94);border:1px solid var(--line);border-radius:12px;font-family:var(--fm);font-size:.74rem;line-height:1.7;z-index:2}
.carte-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--line);color:var(--muted);font-size:.7rem}
.carte-bar i{width:8px;height:8px;border-radius:50%;background:var(--good)}
.carte pre{margin:0;padding:12px 14px;font:inherit;white-space:pre-wrap;color:var(--muted)}
.carte .k{color:#c4b2ff}.carte .s{color:#ff9d7a}.carte .n{color:#8fd0ff}
.bgphoto{position:absolute;inset-block:0;inset-inline-end:0;width:64%;overflow:hidden;pointer-events:none;isolation:isolate;-webkit-mask-image:linear-gradient(to right,#000 30%,transparent 98%);mask-image:linear-gradient(to right,#000 30%,transparent 98%)}
.bgphoto i{position:absolute;inset:-5%;background-size:cover;background-position:50% 30%;filter:grayscale(1) contrast(1.15) blur(1.5px);opacity:.2;animation:drift 26s ease-in-out infinite alternate}
.bgphoto::before{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(to top,var(--bg) 0%,transparent 38%)}
.bgphoto::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(135deg,rgba(124,92,255,.7),rgba(79,107,255,.2) 70%);mix-blend-mode:color}
@keyframes pop{from{opacity:0;transform:scale(.86) translateY(16px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes glow{0%,100%{box-shadow:0 30px 80px rgba(100,68,240,.3)}50%{box-shadow:0 34px 110px rgba(124,92,255,.55)}}
@keyframes ringspin{to{transform:rotate(360deg)}}
@keyframes dotsdrift{from{transform:translate(0,0)}to{transform:translate(10px,12px)}}
@keyframes drift{from{transform:scale(1.02)}to{transform:scale(1.09) translate(-2%,1.5%)}}
.abt{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.abt-t{display:flex;flex-direction:column;align-items:flex-start;gap:18px;min-width:0}
.abt-t h2{font-size:clamp(1.5rem,3.2vw,2rem);font-weight:700}
.abt-t p{color:var(--muted);max-width:52ch}
.lst{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.ls{display:flex;align-items:center;gap:16px;padding:24px 22px;min-width:0}
.ls:nth-child(odd){border-inline-end:1px solid var(--line)}
.ls:nth-child(-n+2){border-bottom:1px solid var(--line)}
.ls-ic{flex:none;display:grid;place-items:center;width:48px;height:48px;border-radius:12px;background:var(--soft);color:var(--accent-text);font:800 1.1rem var(--fd);direction:ltr}
.ls-v{font:800 1.4rem var(--fd);line-height:1.2}
.ls-l{color:var(--muted);font-size:.88rem;line-height:1.45}
.why{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.wcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s}

.wcard .ic{font-size:1.5rem;width:48px;height:48px;display:grid;place-items:center;background:var(--soft);border-radius:12px}

.skills{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.skill{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0;transition:border-color .15s}
.skill:hover{border-color:var(--accent)}
.glyph{flex:none;display:grid;place-items:center;width:48px;height:48px;border-radius:12px;background:var(--soft);color:var(--accent-text);font:italic 1.7rem Georgia,"Times New Roman",serif;line-height:1}
.skill h3{font-size:1rem;direction:ltr;text-align:start}.skill p{color:var(--muted);font-size:.88rem}
.pcards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.pcard{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:border-color .15s,transform .15s}
.pcard:hover{border-color:var(--accent);transform:translateY(-3px)}
.pc-top{position:relative;display:grid;place-items:center;height:138px;background:linear-gradient(135deg,#2b2273,#4a37c9);font:800 2.4rem var(--fd);color:#fff;direction:ltr}
.pcard:nth-child(2) .pc-top{background:linear-gradient(135deg,#1d2b6e,#3b63e0)}
.pcard:nth-child(3) .pc-top{background:linear-gradient(135deg,#3a1f78,#7a45d9)}
.pc-top small{position:absolute;top:10px;inset-inline-start:14px;font:500 .8rem var(--fm);opacity:.8}
.pc-body{display:flex;flex-direction:column;gap:10px;padding:20px;flex:1}
.pc-body h3{font-size:1.1rem}.pc-body p{color:var(--muted);font-size:.93rem}
.pc-body .more{margin-top:auto;padding-top:6px;color:var(--accent-text);font-weight:600;font-size:.92rem}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;gap:16px}
.step b{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--accent-deep),var(--accent-2));font:800 1.1rem var(--fd);color:#fff}
.step h3{font-size:1.05rem;margin-bottom:4px}.step p{color:var(--muted);font-size:.92rem}
.ctab{display:grid;grid-template-columns:1fr 1.1fr;gap:40px;align-items:center}
.ctab-t{display:flex;flex-direction:column;align-items:flex-start;gap:16px}
.ctab-t h2{font-size:clamp(1.5rem,3.2vw,2rem)}.ctab-t p{color:var(--muted);max-width:44ch}
.socials{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.soc{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;transition:border-color .15s,transform .15s}
.soc:hover{border-color:var(--accent);transform:translateY(-2px)}
.soc b{display:block;font:700 .98rem var(--fd)}.soc small{color:var(--muted);font-size:.8rem}.soc i{color:var(--accent-text);font-style:normal}
.foot{margin-top:0}
.foot-in{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px}
.shero{position:relative;overflow:hidden;padding-block:44px 28px;background:radial-gradient(60% 80% at 85% 30%,rgba(124,92,255,.2),transparent 70%),var(--bg);border-bottom:1px solid var(--line)}
.shero-in{display:grid;grid-template-columns:1.3fr .7fr;gap:32px;align-items:center}
.shero .st{display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.shero h1{font-size:clamp(1.7rem,4.4vw,2.6rem);font-weight:800}
.mini{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
.mini>div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 20px;min-width:110px}
.mini b{display:block;font:800 1.45rem var(--fd);line-height:1.25}
.mini span{color:var(--muted);font-size:.84rem}
.num{position:absolute;top:10px;inset-inline-start:12px;z-index:2;font:500 .8rem var(--fm);background:rgba(10,10,31,.78);padding:0 8px;border-radius:6px;color:var(--accent-text)}
.authx{min-height:100vh;display:grid;grid-template-columns:.85fr 1.15fr}
.aside{position:relative;overflow:hidden;display:grid;place-items:center;padding:40px;background:radial-gradient(80% 60% at 30% 20%,rgba(124,92,255,.38),transparent 70%),linear-gradient(160deg,#1a1450,#0d0d27 70%);border-inline-end:1px solid var(--line)}
.aside-in{display:flex;flex-direction:column;gap:18px;max-width:380px;align-items:flex-start}
.aside h2{font-size:1.8rem;font-weight:800}.aside p{color:var(--muted)}
.aside .disc{width:min(100%,200px)}
.pts{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.aform{display:grid;place-items:center;padding:28px 16px;background:var(--bg)}
@media(max-width:900px){.hero-grid,.abt,.ctab,.shero-in{grid-template-columns:1fr}.hero-visual{order:-1;width:min(100%,320px)}.shero .sv{order:-1}.carte{inset-inline-end:-10px}.skills,.pcards,.why{grid-template-columns:1fr 1fr}.steps{grid-template-columns:1fr}.band{padding-block:56px}.bgphoto{width:100%;-webkit-mask-image:linear-gradient(to bottom,#000 25%,transparent 95%);mask-image:linear-gradient(to bottom,#000 25%,transparent 95%)}.bgphoto i{opacity:.15}.authx{grid-template-columns:1fr}.aside{display:none}}
@media(max-width:820px){.pnav{order:3;width:100%;overflow-x:auto;gap:22px;scrollbar-width:none}}
@media(max-width:600px){.skills,.pcards,.why,.socials{grid-template-columns:1fr}.carte{position:static;width:100%;margin-top:20px}.hero-visual{width:min(100%,280px)}.hero-visual .carte{width:min(100vw - 32px,320px)}.ls{padding:18px 12px;gap:10px}.ls-v{font-size:1.15rem}.disc.sm{width:170px}}
@media(prefers-reduced-motion:reduce){.disc,.dots,.bgphoto i,.disc::before{animation:none!important}}

<body>

<script type="module">

import { getStorage, ref, uploadBytesResumable, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

/* =====================  الإعدادات (املأها من Firebase Console)  ===================== */
const firebaseConfig = {
  apiKey: "AIzaSyARDBs4wzZFdnwBEd5ie43IMyJK2d6jxig",
  authDomain: "myweb-126e7.firebaseapp.com",
  projectId: "myweb-126e7",
  storageBucket: "myweb-126e7.firebasestorage.app",
  messagingSenderId: "819972863931",
  appId: "1:819972863931:web:2aa61a2b1a4c50ad9c769e"
};
// بريد حساب الأدمن (يُنشأ يدويًا في Firebase Authentication، وكلمة سره لا تُكتب في أي مكان بالكود)
const ADMIN_EMAIL = "admin@reda-fr.app";
const EMAIL_DOMAIN = "students.reda-fr.app";
/* ================================================================================== */

const STAGES = { primary: "الابتدائية", prep: "الإعدادية", secondary: "الثانوية" };
const SYSTEMS = { lang: "لغات", gov: "حكومي" };
const GRADES = {
  primary: ["الصف الأول", "الصف الثاني", "الصف الثالث", "الصف الرابع", "الصف الخامس", "الصف السادس"],
  prep: ["الأول الإعدادي", "الثاني الإعدادي", "الثالث الإعدادي"],
  secondary: ["الأول الثانوي", "الثاني الثانوي", "الثالث الثانوي"]
};
const CITIES = ["القاهرة","الجيزة","الإسكندرية","الدقهلية","البحيرة","الشرقية","الغربية","المنوفية","القليوبية","كفر الشيخ","دمياط","بورسعيد","الإسماعيلية","السويس","الفيوم","بني سويف","المنيا","أسيوط","سوهاج","قنا","الأقصر","أسوان","البحر الأحمر","الوادي الجديد","مطروح","شمال سيناء","جنوب سيناء","أخرى"];
const AVATARS = ["🦁","🐯","🦊","🐼","🐨","🦄","🐬","🦉","🚀","⭐","🎨","⚽","🎮","📚","🌸","🐱"];
const PHONE_RE = /^01[0125]\d{8}$/;

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const toLatin = s => String(s || "").replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d));
const app = $("#app");
const toast = (m, t = "") => { const e = document.createElement("div"); e.className = "toast " + t; e.textContent = m; $("#toast").append(e); setTimeout(() => e.remove(), 3400); };
const go = h => { if (location.hash !== "#" + h) location.hash = h; else render(); };

/* ---------- تهيئة Firebase ---------- */
if (firebaseConfig.apiKey.startsWith("PASTE")) {
  app.innerHTML = `<div class="auth"><div class="card auth-card"><h1>المنصة تحتاج إعداد Firebase</h1><p class="sub">افتح ملف platform.html وضع بيانات مشروعك في <b>firebaseConfig</b> ثم أعد تحميل الصفحة. التفاصيل في ملف README.</p></div></div>`;
  throw new Error("Firebase config missing");
}
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
const storage = getStorage(fbApp);

/* ---------- الحالة ---------- */
const S = { ready: false, user: null, student: null, busy: false, flash: "", videos: [], files: [], students: [], unsubs: [], unsubSelf: null, page: "" };
const H = { tab: "videos", q: "" };
const A = { tab: "overview", q: "", fstage: "", fstatus: "" };

const isAdminUser = () => !!S.user && S.user.email === ADMIN_EMAIL;
const deviceId = () => { let d = ""; try { d = localStorage.getItem("rf_device") || ""; } catch {} if (!d) { d = (crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(36).slice(2)); try { localStorage.setItem("rf_device", d); } catch {} } return d; };

/* ---------- مساعدات واجهة ---------- */
const brand = () => `<a class="logo" href="#/"><span class="logo-mark">R</span><span dir="ltr">M. Reda Elkhshen<small dir="rtl">منصة تعليم اللغة الفرنسية</small></span></a>`;
const avatarHTML = (s, size = 40) => {
  const p = s?.photo || "", st = `width:${size}px;height:${size}px;font-size:${Math.round(size * .5)}px`;
  if (p.startsWith("data:image/")) return `<span class="av" style="${st}"><img src="${esc(p)}" alt=""></span>`;
  if (p) return `<span class="av" style="${st}">${esc(p)}</span>`;
  return `<span class="av" style="${st}">${esc(((s?.name || "؟").trim()[0]) || "؟")}</span>`;
};
function openModal(html, wide) {
  const o = document.createElement("div"); o.className = "overlay";
  o.innerHTML = `<div class="modal ${wide ? "wide" : ""}" role="dialog" aria-modal="true">${html}</div>`;
  o.addEventListener("mousedown", e => { if (e.target === o) o.remove(); });
  o.addEventListener("click", e => { if (e.target.closest("[data-close]")) o.remove(); });
  $("#modal-root").append(o); return o;
}
const closeModals = () => $("#modal-root").innerHTML = "";
function resizeImage(file, size = 256) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(img.width, img.height), c = document.createElement("canvas"); c.width = c.height = size;
      c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", .82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("img")); };
    img.src = url;
  });
}
function pickerHTML(cur, s) {
  return `<div class="grp">الصورة الشخصية أو الأيقونة<div class="picker"><div id="pv">${avatarHTML({ photo: cur, name: s?.name }, 76)}</div><div><div class="emojis">${AVATARS.map(e => `<button type="button" class="em" data-e="${e}" aria-label="أيقونة ${e}">${e}</button>`).join("")}</div><label class="btn btn-line btn-sm">رفع صورة<input type="file" accept="image/*" hidden id="pfile"></label></div></div></div>`;
}
function bindPicker(root, initial, name) {
  let val = initial || "";
  const show = () => $("#pv", root).innerHTML = avatarHTML({ photo: val, name }, 76);
  root.addEventListener("click", e => { const b = e.target.closest(".em"); if (b) { val = b.dataset.e; show(); } });
  $("#pfile", root).addEventListener("change", async e => {
    const f = e.target.files[0]; if (!f) return;
    if (!f.type.startsWith("image/")) return toast("اختر ملف صورة", "err");
    try { val = await resizeImage(f); show(); } catch { toast("تعذر قراءة الصورة", "err"); }
  });
  return () => val;
}
const gradeOpts = (stage, cur) => `<option value="">اختر الصف</option>` + (GRADES[stage] || []).map(g => `<option ${g === cur ? "selected" : ""}>${g}</option>`).join("");
function profileFields(s = {}) {
  return `
  <label class="fl">الاسم الكامل<input name="name" maxlength="60" autocomplete="name" value="${esc(s.name)}"></label>
  <div class="grp">المرحلة الدراسية<div class="chips">${Object.entries(STAGES).map(([k, v]) => `<label class="chip"><input type="radio" name="stage" value="${k}" ${s.stage === k ? "checked" : ""}><span>${v}</span></label>`).join("")}</div></div>
  <div class="grp">نوع التعليم<div class="chips">${Object.entries(SYSTEMS).map(([k, v]) => `<label class="chip"><input type="radio" name="system" value="${k}" ${s.system === k ? "checked" : ""}><span>${v}</span></label>`).join("")}</div></div>
  <div class="row2">
    <label class="fl">الصف الدراسي<select name="grade">${gradeOpts(s.stage, s.grade)}</select></label>
    <label class="fl">المدينة / المحافظة<select name="city"><option value="">اختر</option>${CITIES.map(c => `<option ${c === s.city ? "selected" : ""}>${c}</option>`).join("")}</select></label>
  </div>
  <div class="row2">
    <label class="fl">اسم المدرسة (اختياري)<input name="school" maxlength="80" value="${esc(s.school)}"></label>
    <label class="fl">رقم ولي الأمر (اختياري)<input name="parentPhone" dir="ltr" inputmode="numeric" maxlength="11" value="${esc(s.parentPhone)}"></label>
  </div>`;
}
function bindStageGrade(form) {
  $$('input[name="stage"]', form).forEach(r => r.addEventListener("change", () => { $('select[name="grade"]', form).innerHTML = gradeOpts(r.value, ""); }));
}
function readProfile(form) {
  const f = new FormData(form);
  const v = { name: (f.get("name") || "").trim().replace(/\s+/g, " "), stage: f.get("stage"), system: f.get("system"), grade: f.get("grade"), city: f.get("city"), school: (f.get("school") || "").trim(), parentPhone: toLatin(f.get("parentPhone") || "").replace(/[\s-]/g, "") };
  if (v.name.length < 3) throw new Error("اكتب اسمك بالكامل");
  if (!STAGES[v.stage]) throw new Error("اختر المرحلة الدراسية");
  if (!SYSTEMS[v.system]) throw new Error("اختر نوع التعليم (لغات أو حكومي)");
  if (!v.grade) throw new Error("اختر الصف الدراسي");
  if (!v.city) throw new Error("اختر المدينة");
  if (v.parentPhone && !PHONE_RE.test(v.parentPhone)) throw new Error("رقم ولي الأمر غير صحيح");
  return v;
}
const showErr = (m) => { const e = $("#err"); if (e) { e.textContent = m; e.hidden = !m; if (m) e.scrollIntoView({ block: "nearest" }); } };
const flash = () => { const m = S.flash; S.flash = ""; return m ? `<div class="alert">${esc(m)}</div>` : ""; };
function authMsg(e) {
  const c = e?.code || "";
  if (["auth/invalid-credential", "auth/wrong-password", "auth/user-not-found", "auth/invalid-email"].includes(c)) return "رقم الواتس أو كلمة السر غير صحيحة";
  if (c === "auth/too-many-requests") return "محاولات كثيرة. انتظر قليلًا ثم حاول مرة أخرى";
  if (c === "auth/network-request-failed") return "تعذر الاتصال بالإنترنت";
  if (c === "auth/operation-not-allowed") return "تسجيل الدخول بالبريد غير مفعّل في Firebase (راجع README)";
  return "حدث خطأ غير متوقع، حاول مرة أخرى";
}
const fmtSize = n => !n ? "" : n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
const fmtDate = t => { try { return t?.toDate ? t.toDate().toLocaleDateString("ar-EG", { year: "numeric", month: "short", day: "numeric" }) : "—"; } catch { return "—"; } };
const ytId = u => { u = (u || "").trim(); if (/^[\w-]{11}$/.test(u)) return u; const m = u.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/))([\w-]{11})/); return m ? m[1] : ""; };
const driveLink = u => { const m = (u || "").match(/drive\.google\.com\/file\/d\/([\w-]+)/) || (u || "").match(/drive\.google\.com\/open\?id=([\w-]+)/); return m ? `https://drive.google.com/uc?export=download&id=${m[1]}` : u; };
const stageLabel = v => v === "all" ? "كل المراحل" : STAGES[v] || "—";
const sysLabel = v => v === "all" ? "لغات + حكومي" : SYSTEMS[v] || "—";

/* ---------- المصادقة ---------- */
function clearSubs() { S.unsubs.forEach(f => f()); S.unsubs = []; if (S.unsubSelf) { S.unsubSelf(); S.unsubSelf = null; } }
function sub(col, key) {
  const q = query(collection(db, col), orderBy("createdAt", "desc"));
  S.unsubs.push(onSnapshot(q, s => { S[key] = s.docs.map(d => ({ id: d.id, ...d.data() })); onData(); }, e => console.warn(col, e.code)));
}
function onData() {
  if (isAdminUser()) { if ($("#abody")) fillTab(); }
  else if (S.page === "home") fillHome();
  else if (S.page === "watch" && !S.watchOk) render();
}
async function kick(msg) { S.flash = msg; S.student = null; clearSubs(); try { await signOut(auth); } catch {} if (!S.user) render(); }
async function attachStudent(u) {
  const dref = doc(db, "students", u.uid), dev = deviceId();
  let snap;
  try { snap = await getDoc(dref); } catch { return kick("تعذر الاتصال بالخادم، حاول مرة أخرى"); }
  if (!snap.exists()) return kick("هذا الحساب غير موجود أو تم حذفه. تواصل مع المدرس.");
  const d = snap.data();
  if (d.status === "banned") return kick("تم حظر هذا الحساب. تواصل مع المدرس.");
  if (!d.deviceId) { try { await updateDoc(dref, { deviceId: dev }); d.deviceId = dev; } catch { return kick("تعذر تثبيت الحساب على هذا الجهاز"); } }
  else if (d.deviceId !== dev) return kick("هذا الحساب مسجّل على جهاز آخر. تواصل مع المدرس لفك ارتباطه.");
  S.student = { id: u.uid, ...d };
  clearSubs();
  S.unsubSelf = onSnapshot(dref, s => {
    if (!s.exists()) return kick("تم حذف هذا الحساب.");
    const x = s.data();
    if (x.status === "banned") return kick("تم حظر هذا الحساب. تواصل مع المدرس.");
    if (x.deviceId && x.deviceId !== dev) return kick("تم تسجيل الدخول لهذا الحساب من جهاز آخر.");
    S.student = { id: u.uid, ...x };
  }, () => {});
  sub("videos", "videos"); sub("files", "files");
  S.ready = true; render();
}
onAuthStateChanged(auth, async u => {
  clearSubs(); S.user = u; S.student = null;
  if (!u) { S.ready = true; render(); return; }
  if (u.email === ADMIN_EMAIL) { sub("students", "students"); sub("videos", "videos"); sub("files", "files"); S.ready = true; render(); return; }
  if (S.busy) return;
  await attachStudent(u);
});
const doLogout = async () => { try { await signOut(auth); } catch {} go("/"); };

/* ---------- الراوتر ---------- */
window.addEventListener("hashchange", () => { closeModals(); render(); window.scrollTo(0, 0); });
function render() {
  if (!S.ready) return;
  const route = location.hash.slice(1) || "/";
  S.page = ""; S.watchOk = false;
  if (isAdminUser()) { if (route.startsWith("/admin") && route !== "/admin-login") return renderAdmin(); return go("/admin"); }
  if (route === "/admin-login") return renderAdminLogin();
  if (S.user && S.student) {
    if (route === "/profile") return renderProfile();
    if (route.startsWith("/watch/")) return renderWatch(route.slice(7));
    return renderHome();
  }
  if (S.user && !S.student) { app.innerHTML = `<div class="loading"><div><div class="spin"></div>جاري التحقق من الحساب...</div></div>`; return; }
  if (route === "/register") return renderRegister();
  if (route === "/login" || S.flash) return renderLogin();
  renderLanding();
}

/* ---- إجراءات الطلاب ---- */
async function studentAction(e) {
  const btn = e.target.closest("[data-a]"); if (!btn || btn.tagName === "A") return;
  const id = btn.dataset.id, x = S.students.find(s => s.id === id); if (!x) return;
  const dref = doc(db, "students", id);
  try {
    if (btn.dataset.a === "ban") {
      const ban = x.status !== "banned";
      if (!confirm(ban ? `حظر الطالب ${x.name}؟` : `فك الحظر عن ${x.name}؟`)) return;
      await updateDoc(dref, { status: ban ? "banned" : "active" }); toast(ban ? "تم الحظر" : "تم فك الحظر", "ok");
    } else if (btn.dataset.a === "dev") {
      if (!confirm(`فك ارتباط جهاز ${x.name}؟ سيستطيع تسجيل الدخول من جهاز جديد.`)) return;
      await updateDoc(dref, { deviceId: "" }); toast("تم فك ارتباط الجهاز", "ok");
    } else if (btn.dataset.a === "del") {
      if (!confirm(`حذف الطالب ${x.name} نهائيًا؟ لا يمكن التراجع.`)) return;
      await deleteDoc(dref); toast("تم حذف الطالب", "ok");
    } else if (btn.dataset.a === "edit") editStudent(x);
  } catch (er) { toast("فشلت العملية: " + (er.code || er.message), "err"); }
}
function editStudent(x) {
  const m = openModal(`<h2>تعديل بيانات الطالب</h2><p class="sub" dir="ltr" style="text-align:start">${esc(x.phone)}</p><div class="alert" id="err" hidden></div>
    <form id="ef" novalidate>${profileFields(x)}<label class="fl">الحالة<select name="status"><option value="active" ${x.status !== "banned" ? "selected" : ""}>نشط</option><option value="banned" ${x.status === "banned" ? "selected" : ""}>محظور</option></select></label>
    <div class="mact"><button class="btn btn-fill" id="sb">حفظ</button><button type="button" class="btn btn-line" data-close>إلغاء</button></div></form>`, true);
  const form = $("#ef", m); bindStageGrade(form);
  form.addEventListener("submit", async e => {
    e.preventDefault(); showErr("");
    try { const p = readProfile(form); p.status = new FormData(form).get("status"); $("#sb", m).disabled = true; await updateDoc(doc(db, "students", x.id), p); m.remove(); toast("تم الحفظ", "ok"); }
    catch (er) { showErr(er.message); $("#sb", m).disabled = false; }
  });
}

/* ---- إجراءات الفيديو والملفات ---- */
async function contentAction(e) {
  const btn = e.target.closest("[data-a]"); if (!btn || btn.tagName === "A") return;
  const a = btn.dataset.a, id = btn.dataset.id;
  try {
    if (a === "vadd") return videoModal();
    if (a === "vedit") return videoModal(S.videos.find(v => v.id === id));
    if (a === "vdel") { const v = S.videos.find(v => v.id === id); if (v && confirm(`حذف الفيديو "${v.title}"؟`)) { await deleteDoc(doc(db, "videos", id)); toast("تم الحذف", "ok"); } return; }
    if (a === "fadd") return fileModal();
    if (a === "fedit") return fileModal(S.files.find(f => f.id === id));
    if (a === "fdel") {
      const f = S.files.find(f => f.id === id); if (!f || !confirm(`حذف الملف "${f.title}"؟`)) return;
      if (f.storagePath) { try { await deleteObject(ref(storage, f.storagePath)); } catch {} }
      await deleteDoc(doc(db, "files", id)); toast("تم الحذف", "ok");
    }
  } catch (er) { toast("فشلت العملية: " + (er.code || er.message), "err"); }
}
const targetFields = c => `<div class="row2"><label class="fl">المرحلة<select name="stage">${opts(STAGES, c?.stage || "all", { all: "كل المراحل" })}</select></label>

    <div class="mact"><button class="btn btn-fill" id="sb">حفظ</button><button type="button" class="btn btn-line" data-close>إلغاء</button></div></form>`);
  $("#ff", m).addEventListener("submit", async e => {
    e.preventDefault(); showErr(""); const f = new FormData(e.target), title = (f.get("title") || "").trim(), file = f.get("file"), link = (f.get("url") || "").trim();
    if (!title) return showErr("اكتب عنوان الملف");
    const has = file && file.size > 0;
    if (!fl && !has && !link) return showErr("ارفع ملفًا أو ضع رابطًا");
    if (has && file.size > 50 * 1048576) return showErr("الحد الأقصى لحجم الملف 50 ميجا");
    const data = { title, stage: f.get("stage"), system: f.get("system") };
    $("#sb", m).disabled = true;
    try {
      if (has) {
        const ext = (file.name.split(".").pop() || "file").toLowerCase().slice(0, 5);
        if (!["pdf", "doc", "docx"].includes(ext)) throw new Error("الصيغ المسموحة: PDF أو Word فقط");
        const path = `files/${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`, task = uploadBytesResumable(ref(storage, path), file), pg = $("#pg", m); pg.hidden = false;
        await new Promise((res, rej) => task.on("state_changed", s => { $("i", pg).style.width = (s.bytesTransferred / s.totalBytes * 100) + "%"; }, rej, res));
        const url = await getDownloadURL(task.snapshot.ref);
        if (fl?.storagePath) { try { await deleteObject(ref(storage, fl.storagePath)); } catch {} }
        Object.assign(data, { url, storagePath: path, ext, size: file.size });
      } else if (link) {
        if (!/^https?:\/\//i.test(link)) throw new Error("الرابط يجب أن يبدأ بـ https://");
        if (fl?.storagePath && link !== fl.url) { try { await deleteObject(ref(storage, fl.storagePath)); } catch {} }
        if (!fl || link !== fl.url) Object.assign(data, { url: driveLink(link), storagePath: "", ext: (link.split("?")[0].split(".").pop() || "").length <= 4 ? link.split("?")[0].split(".").pop().toLowerCase() : "link", size: 0 });
      }
      if (fl) await updateDoc(doc(db, "files", fl.id), data); else await addDoc(collection(db, "files"), { ...data, createdAt: serverTimestamp() });
      m.remove(); toast("تم الحفظ", "ok");
    } catch (er) {
      const stor = (er.code || "").startsWith("storage/");
      showErr(stor ? "تعذر الرفع على Firebase Storage. تأكد من تفعيله وقواعده، أو استخدم رابطًا مباشرًا بدلًا من الرفع." : (er.message || "فشل الحفظ"));
      $("#sb", m).disabled = false; $("#pg", m).hidden = true;
    }
  });
}

/* ---------- تشغيل ---------- */
window.addEventListener("hashchange", () => {});
document.addEventListener("click", e => { if (e.target.closest("#lo")) return; });
</script>
