function bindIQ(root) {
  if (!root) return;
  $$(".iq.fill .bl", root).forEach(x => x.addEventListener("keydown", e => { if (e.key === "Enter") e.preventDefault(); }));
  $$(".iq.drag", root).forEach(el => {
    let sel = null, dragging = null;
    const slots = $$(".slot", el);
    const unput = sl => { if (sl._c) sl._c.classList.remove("used"); sl._c = null; sl.textContent = ""; sl.classList.remove("fil"); };
    const put = (sl, ch) => { if (!ch || ch.classList.contains("used")) return; if (sl._c) unput(sl); sl._c = ch; sl.textContent = ch.textContent; sl.classList.add("fil"); ch.classList.add("used"); ch.classList.remove("sel"); sel = null; };
    $$(".chip", el).forEach(ch => {
      ch.addEventListener("click", () => { const on = sel === ch; $$(".chip", el).forEach(c => c.classList.remove("sel")); sel = on ? null : ch; if (sel) ch.classList.add("sel"); });
      ch.addEventListener("dragstart", e => { dragging = ch; try { e.dataTransfer.setData("text/plain", ch.textContent); e.dataTransfer.effectAllowed = "move"; } catch {} });
      ch.addEventListener("dragend", () => { dragging = null; slots.forEach(x => x.classList.remove("over")); });
    });
    slots.forEach(sl => {
      sl.addEventListener("click", () => { if (sel) put(sl, sel); else if (sl._c) unput(sl); });
      sl.addEventListener("dragover", e => { e.preventDefault(); sl.classList.add("over"); });
      sl.addEventListener("dragleave", () => sl.classList.remove("over"));
      sl.addEventListener("drop", e => { e.preventDefault(); sl.classList.remove("over"); if (dragging) put(sl, dragging); });
    });
  });
  $$(".iq.match", root).forEach(el => {

        if (!fl || link !== fl.url) Object.assign(data, { url: driveLink(link), storagePath: "", ext: (link.split("?")[0].split(".").pop() || "").length <= 4 ? link.split("?")[0].split(".").pop().toLowerCase() : "link", size: 0 });
      }
      if (fl) await updateDoc(doc(db, "files", fl.id), data); else { await addDoc(collection(db, "files"), { ...data, createdAt: serverTimestamp() }); await autoNotice({ ic: "📄", title: "ملف جديد: " + (data.title || "ملف"), body: "تمت إضافة ملف جديد لمرحلتك" }, data); }
      m.remove(); toast("تم الحفظ", "ok");
    } catch (er) {
      const stor = (er.code || "").startsWith("storage/");
      showErr(stor ? "تعذر الرفع على Firebase Storage. تأكد من تفعيله وقواعده، أو استخدم رابطًا مباشرًا بدلًا من الرفع." : (er.message || "فشل الحفظ"));
      $("#sb", m).disabled = false; $("#pg", m).hidden = true;
    }
  });
}


/* حركة الصورة مع المؤشر (ديسكتوب فقط) */
(() => { const rm = matchMedia("(prefers-reduced-motion:reduce)"); let raf = 0;
  document.addEventListener("pointermove", e => { if (e.pointerType !== "mouse" || rm.matches || raf) return; raf = requestAnimationFrame(() => { raf = 0; const r = document.documentElement.style; r.setProperty("--px", ((e.clientX / innerWidth - .5) * -18).toFixed(1) + "px"); r.setProperty("--py", ((e.clientY / innerHeight - .5) * -14).toFixed(1) + "px"); }); });
})();
/* ---------- تشغيل ---------- */
window.addEventListener("hashchange", () => {});
document.addEventListener("click", e => { if (e.target.closest("#lo")) return; });
</script>
